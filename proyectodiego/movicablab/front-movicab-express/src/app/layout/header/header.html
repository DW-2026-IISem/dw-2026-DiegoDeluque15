<header class="bg-slate-900 text-white px-5 py-3 flex items-center justify-between shadow-md border-b border-slate-800">
  <div class="flex items-center gap-3">
    <p-button icon="pi pi-bars" [text]="true" severity="secondary" class="md:hidden text-white" (onClick)="openMenu()" />
    <span class="text-xl font-bold tracking-wide text-white">{{ title }}</span>
    <span class="text-emerald-400 font-semibold text-sm bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-800">Express</span>
  </div>

  <!-- Barra de Usuario en Sesión -->
  <div class="flex items-center gap-4">
    @if (session.user(); as user) {
      <div class="hidden sm:flex flex-col text-right">
        <span class="text-sm font-semibold text-slate-100 flex items-center justify-end gap-1.5">
          <i class="pi pi-user text-xs text-indigo-400"></i>
          {{ user.username }}
        </span>
        <span class="text-xs text-slate-400">{{ user.email }}</span>
      </div>

      <div class="flex items-center gap-2">
        <p-button
          icon="pi pi-shield"
          label="Mi Perfil"
          [text]="true"
          severity="secondary"
          size="small"
          routerLink="/profile"
          styleClass="text-slate-200 hover:text-white"
        />

        <p-button
          icon="pi pi-sign-out"
          label="Salir"
          [text]="true"
          severity="danger"
          size="small"
          (onClick)="logout()"
        />
      </div>
    } @else {
      <p-button
        label="Iniciar Sesión"
        icon="pi pi-sign-in"
        size="small"
        routerLink="/login"
      />
    }
  </div>
</header>
