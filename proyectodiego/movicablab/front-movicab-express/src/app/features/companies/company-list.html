<app-page-header title="Empresas">
    <p-button label="Nueva empresa" icon="pi pi-plus" routerLink="new" />
</app-page-header>

@if (loading()) {
<p class="text-center text-slate-400 py-10">Cargando empresas...</p>
} @else if (companies().length === 0) {
<app-empty-state icon="pi-building" message="No hay empresas registradas en el sistema" />
} @else {
<p-table [value]="companies()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
    <ng-template #header>
        <tr>
            <th>ID</th>
            <th>Razón Social</th>
            <th>NIT / Identificación</th>
            <th>Contacto Principal</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </ng-template>

    <ng-template #body let-c>
        <tr>
            <td>{{ c.id }}</td>
            <td class="font-semibold text-slate-800">{{ c.legal_name }}</td>
            <td>{{ c.tax_id }}</td>
            <td>{{ c.primary_contact || '—' }}</td>
            <td>
                <p-tag [value]="c.status === 'active' ? 'Activo' : 'Inactivo'"
                    [severity]="c.status === 'active' ? 'success' : 'danger'" />
            </td>
            <td class="flex gap-2">
                <p-button icon="pi pi-pencil" [text]="true" severity="info" [routerLink]="[c.id, 'edit']" />
                <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(c)" />
            </td>
        </tr>
    </ng-template>
</p-table>
}
