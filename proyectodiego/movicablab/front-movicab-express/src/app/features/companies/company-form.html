<app-page-header [title]="isEdit() ? 'Editar Empresa' : 'Nueva Empresa'">
    <p-button label="Volver a la lista" icon="pi pi-arrow-left" severity="secondary" [text]="true"
        routerLink="/companies" />
</app-page-header>

@if (loading()) {
<div class="p-6 text-center text-slate-400">
    <i class="pi pi-spin pi-spinner text-2xl mr-2"></i>
    Cargando datos...
</div>
} @else {
<div class="mx-auto max-w-2xl rounded-lg bg-white p-6 shadow-sm">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <!-- Razón Social -->
        <div class="flex flex-col gap-1">
            <label for="legal_name" class="text-sm font-semibold text-slate-700">Razón Social *</label>
            <input id="legal_name" type="text" pInputText formControlName="legal_name"
                placeholder="Ej. Transportes del Norte S.A.S." class="w-full" />
            @if (form.get('legal_name')?.touched && form.get('legal_name')?.hasError('required')) {
            <small class="text-red-500">La razón social es obligatoria.</small>
            }
        </div>

        <!-- NIT / Identificación Tributaria -->
        <div class="flex flex-col gap-1">
            <label for="tax_id" class="text-sm font-semibold text-slate-700">NIT / Identificación Tributaria *</label>
            <input id="tax_id" type="text" pInputText formControlName="tax_id" placeholder="Ej. 900.123.456-7"
                class="w-full" />
            @if (form.get('tax_id')?.touched && form.get('tax_id')?.hasError('required')) {
            <small class="text-red-500">El NIT o identificación es obligatorio.</small>
            }
        </div>

        <!-- Contacto Principal -->
        <div class="flex flex-col gap-1">
            <label for="primary_contact" class="text-sm font-semibold text-slate-700">Contacto Principal (Nombre /
                Teléfono)</label>
            <input id="primary_contact" type="text" pInputText formControlName="primary_contact"
                placeholder="Ej. Sandra Pérez - 315 987 6543" class="w-full" />
        </div>

        <!-- Estado -->
        <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-slate-700">Estado de la Empresa</label>
            <p-selectbutton [options]="statusOptions" formControlName="status" optionLabel="label"
                optionValue="value" />
        </div>

        <!-- Botones de Acción -->
        <div class="mt-4 flex justify-end gap-3 border-t border-slate-100 pt-4">
            <p-button type="button" label="Cancelar" severity="secondary" [text]="true" routerLink="/companies" />
            <p-button type="submit" [label]="isEdit() ? 'Guardar Cambios' : 'Registrar Empresa'" icon="pi pi-check"
                [loading]="saving()" />
        </div>

    </form>
</div>
}
