<div class="login-wrapper">
    <div class="login-card">
        <h1 class="login-title">MoviCab Express</h1>
        <p class="login-subtitle">Inicia sesión para continuar</p>

        @if (error()) {
        <p-message severity="error" styleClass="w-full mb-4">{{ error() }}</p-message>
        }

        <form (ngSubmit)="onSubmit()" class="login-form">
            <div class="field">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" pInputText [(ngModel)]="email" [ngModelOptions]="{ standalone: true }"
                    placeholder="usuario@ejemplo.com" class="w-full" required />
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <p-password inputId="password" [(ngModel)]="password" [ngModelOptions]="{ standalone: true }"
                    [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"
                    placeholder="••••••••" required />
            </div>

            <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" styleClass="w-full" [loading]="loading()" />
        </form>
    </div>
</div>
