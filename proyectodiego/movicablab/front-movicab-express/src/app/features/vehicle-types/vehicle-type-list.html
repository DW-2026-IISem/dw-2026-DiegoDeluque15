<app-page-header title="Tipos de Vehículo">
    <p-button label="Nuevo tipo" icon="pi pi-plus" routerLink="new" />
</app-page-header>

@if (loading()) {
<p class="text-center text-slate-400 py-10">Cargando tipos de vehículo...</p>
} @else if (vehicleTypes().length === 0) {
<app-empty-state icon="pi-tags" message="No hay tipos de vehículo registrados en el sistema" />
} @else {
<p-table [value]="vehicleTypes()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
    <ng-template #header>
        <tr>
            <th>ID</th>
            <th>Nombre del Tipo</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </ng-template>

    <ng-template #body let-t>
        <tr>
            <td>{{ t.id }}</td>
            <td class="font-semibold text-slate-800">{{ t.name }}</td>
            <td>{{ t.description || '—' }}</td>
            <td>
                <p-tag [value]="t.status === 'active' ? 'Activo' : 'Inactivo'"
                    [severity]="t.status === 'active' ? 'success' : 'danger'" />
            </td>
            <td class="flex gap-2">
                <p-button icon="pi pi-pencil" [text]="true" severity="info" [routerLink]="[t.id, 'edit']" />
                <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(t)" />
            </td>
        </tr>
    </ng-template>
</p-table>
}
