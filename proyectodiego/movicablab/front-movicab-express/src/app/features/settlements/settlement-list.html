<app-page-header title="Liquidaciones" subtitle="Liquidaciones periódicas de viajes agrupados por conductor">
  <p-button label="Generar liquidación" icon="pi pi-plus" routerLink="/settlements/new" />
</app-page-header>

<p-table
  [value]="settlements()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [tableStyle]="{ 'min-width': '60rem' }"
  styleClass="p-datatable-sm p-datatable-striped"
>
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Conductor</th>
      <th>Periodo (Desde / Hasta)</th>
      <th>Fecha Generación</th>
      <th>Monto Total</th>
      <th>Estado</th>
    </tr>
  </ng-template>

  <ng-template #body let-s>
    <tr>
      <td><strong>#{{ s.id }}</strong></td>
      <td class="font-semibold text-slate-800">
        <i class="pi pi-id-card text-xs text-slate-500 mr-1"></i>
        {{ getDriverName(s.driver_id) }}
      </td>
      <td>
        <span class="text-sm">
          {{ s.date_from | date:'dd/MM/yyyy' }} — {{ s.date_to | date:'dd/MM/yyyy' }}
        </span>
      </td>
      <td>{{ s.generated_at | date:'dd/MM/yyyy HH:mm' }}</td>
      <td class="font-bold text-emerald-600">
        ${{ s.total_amount | number:'1.2-2' }}
      </td>
      <td>
        <p-tag
          [value]="s.status || 'Liquidado'"
          severity="info"
        />
      </td>
    </tr>
  </ng-template>

  <ng-template #empty>
    <tr>
      <td colspan="6" class="text-center py-8">
        <app-empty-state icon="pi pi-calculator" message="No hay liquidaciones registradas aún. Haz clic en 'Generar liquidación' para crear una." />
      </td>
    </tr>
  </ng-template>
</p-table>
