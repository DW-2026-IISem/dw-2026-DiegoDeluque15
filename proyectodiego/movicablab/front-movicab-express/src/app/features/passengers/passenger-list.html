<app-page-header title="Pasajeros">
    <p-button label="Nuevo pasajero" icon="pi pi-plus" routerLink="new" />
</app-page-header>

@if (loading()) {
<p class="text-center text-slate-400 py-10">Cargando...</p>
} @else if (passengers().length === 0) {
<app-empty-state icon="pi-users" message="No hay pasajeros registrados" />
} @else {
<p-table [value]="passengers()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
    <ng-template #header>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </ng-template>

    <ng-template #body let-p>
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.email }}</td>
            <td>{{ p.phone }}</td>
            <td>{{ p.address }}</td>
            <td>
                <p-tag [value]="p.status === 'active' ? 'Activo' : 'Inactivo'"
                    [severity]="p.status === 'active' ? 'success' : 'danger'" />
            </td>
            <td class="flex gap-2">
                <p-button icon="pi pi-pencil" [text]="true" severity="info" [routerLink]="[p.id, 'edit']" />
                <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(p)" />
            </td>
        </tr>
    </ng-template>
</p-table>
}
