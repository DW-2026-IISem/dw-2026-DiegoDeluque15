<app-page-header title="Turnos" subtitle="Gestión de turnos de conductores y vehículos">
  <p-button label="Nuevo turno" icon="pi pi-plus" routerLink="/shifts/new" />
</app-page-header>

@if (loading()) {
  <p class="text-center text-slate-400 py-10">Cargando...</p>
} @else if (shifts().length === 0) {
  <app-empty-state icon="pi-clock" message="No hay turnos registrados." />
} @else {
<p-table
  [value]="shifts()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [tableStyle]="{ 'min-width': '55rem' }"
  styleClass="p-datatable-sm p-datatable-striped"
>
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Conductor</th>
      <th>Vehículo</th>
      <th>Estado</th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-shift>
    <tr>
      <td>{{ shift.name }}</td>
      <td>{{ shift.driver?.name ?? '—' }}</td>
      <td>{{ shift.vehicle?.name ?? '—' }}</td>
      <td>
        <p-tag
          [value]="shift.status === 'active' ? 'Activo' : 'Inactivo'"
          [severity]="shift.status === 'active' ? 'success' : 'secondary'"
        />
      </td>
      <td class="flex gap-2">
        <p-button icon="pi pi-pencil" [text]="true" severity="info"
                  [routerLink]="['/shifts', shift.id, 'edit']" />
        <p-button icon="pi pi-trash" [text]="true" severity="danger"
                  (onClick)="confirmDelete(shift)" />
      </td>
    </tr>
  </ng-template>
</p-table>
}
