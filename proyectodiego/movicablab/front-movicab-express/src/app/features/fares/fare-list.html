<app-page-header title="Tarifas" subtitle="Gestión de tarifas vigentes y anteriores">
  <p-button label="Nueva tarifa" icon="pi pi-plus" routerLink="/fares/new" />
</app-page-header>

@if (loading()) {
  <p class="text-center text-slate-400 py-10">Cargando...</p>
} @else if (fares().length === 0) {
  <app-empty-state icon="pi-dollar" message="No hay tarifas registradas." />
} @else {
<p-table
  [value]="fares()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [tableStyle]="{ 'min-width': '60rem' }"
  styleClass="p-datatable-sm p-datatable-striped"
>
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Valor Base</th>
      <th>Válida Desde</th>
      <th>Válida Hasta</th>
      <th>Estado</th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-fare>
    <tr>
      <td>{{ fare.name }}</td>
      <td>{{ fare.base_value | number:'1.2-2' }}</td>
      <td>{{ fare.valid_from | date:'dd/MM/yyyy' }}</td>
      <td>{{ fare.valid_until | date:'dd/MM/yyyy' }}</td>
      <td>
        <p-tag
          [value]="fare.status === 'active' ? 'Activa' : 'Inactiva'"
          [severity]="fare.status === 'active' ? 'success' : 'secondary'"
        />
      </td>
      <td class="flex gap-2">
        <p-button icon="pi pi-pencil" [text]="true" severity="info"
                  [routerLink]="['/fares', fare.id, 'edit']" />
        <p-button icon="pi pi-trash" [text]="true" severity="danger"
                  (onClick)="confirmDelete(fare)" />
      </td>
    </tr>
  </ng-template>
</p-table>
}
