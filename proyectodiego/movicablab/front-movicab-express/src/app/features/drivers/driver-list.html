<app-page-header title="Conductores" subtitle="Gestión de conductores registrados">
  <p-button label="Nuevo conductor" icon="pi pi-plus" routerLink="/drivers/new" />
</app-page-header>

@if (loading()) {
  <p class="text-center text-slate-400 py-10">Cargando...</p>
} @else if (drivers().length === 0) {
  <app-empty-state icon="pi-id-card" message="No hay conductores registrados." />
} @else {
<p-table
  [value]="drivers()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [tableStyle]="{ 'min-width': '50rem' }"
  styleClass="p-datatable-sm p-datatable-striped"
>
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Empresa</th>
      <th>Estado</th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-driver>
    <tr>
      <td>{{ driver.name }}</td>
      <td>{{ driver.company?.legal_name ?? '—' }}</td>
      <td>
        <p-tag
          [value]="driver.status === 'active' ? 'Activo' : 'Inactivo'"
          [severity]="driver.status === 'active' ? 'success' : 'secondary'"
        />
      </td>
      <td class="flex gap-2">
        <p-button icon="pi pi-pencil" [text]="true" severity="info"
                  [routerLink]="['/drivers', driver.id, 'edit']" />
        <p-button icon="pi pi-trash" [text]="true" severity="danger"
                  (onClick)="confirmDelete(driver)" />
      </td>
    </tr>
  </ng-template>
</p-table>
}
